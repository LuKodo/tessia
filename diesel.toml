# For documentation on how to configure this file,
# see https://diesel.rs/guides/configuring-diesel-cli
#
# There are two embedded migration sets with the same tables: `migrations/nt_store`
# (global Nota Técnica database) and `migrations/load` (each cargue's database).
# Both produce the same schema, so a single `schema.rs` serves both.

[print_schema]
file = "src/db/schema.rs"

[migrations_directory]
dir = "migrations/load"
