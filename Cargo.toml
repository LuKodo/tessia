[package]
name = "tessia"
version = "0.1.0"
edition = "2024"
build = "src/build.rs"

[lib]
name = "tessia"
path = "src/lib.rs"

[[bin]]
name = "facturacion"
path = "src/main.rs"

[features]
# Exposes `db::test_support` (random throwaway databases) to integration tests
# and to other crates; unit tests always have it.
test-support = ["dep:tiny_http"]
# The desktop window (wry/tao webview). Linux builds need the system GTK and
# WebKitGTK development packages; a headless (server/cron) build can opt out
# with `--no-default-features`, which keeps the pure parts of `desktop`.
default = ["desktop"]
desktop = ["dep:rust-embed", "dep:tao", "dep:wry", "dep:muda"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1"
ctrlc = { version = "3", features = ["termination"] }
diesel = { version = "2.3.14", features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
hex = "0.4"
hostname = "0.4"
http = "1"
libc = "0.2"
md-5 = "0.10"
mime_guess = "2"
percent-encoding = "2"
# Statically builds libpq so the binary does not need a system libpq.
# No OpenSSL: the app's Postgres is local/plain-TCP, so libpq is built
# without TLS and the Windows build needs no OpenSSL installation.
pq-sys = { version = "0.7", features = ["bundled_without_openssl"] }
quick-xml = "0.38"
r2d2 = "0.8"
rand = "0.9"
redis = { version = "1", features = ["tls-rustls-webpki-roots"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "cookies", "gzip", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust_decimal = { version = "1", features = ["db-diesel2-postgres", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0.21"
tiny_http = { version = "0.12", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# soporte: pure-Rust PDF building/merging (lopdf), image decoding (image) and glyph rasterizing (ab_glyph)
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
lopdf = { version = "0.46", default-features = false }

# desktop window: the OS Downloads folder; feature `desktop`: the webview, its
# window loop and the UI embedded at build time.
dirs = "7"
rust-embed = { version = "8", features = ["debug-embed"], optional = true }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Without `linux-body` WebKitGTK custom-protocol requests arrive with an empty body.
wry = { version = "0.57", features = ["linux-body"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# tao has no menu: without an Edit menu Cmd+C / Cmd+V do not reach the webview.
muda = { version = "0.17", optional = true }

[dev-dependencies]
# Self dependency: integration tests in tests/ get the `test-support` feature.
tessia = { path = ".", default-features = false, features = ["test-support"] }
tempfile = "3"
tiny_http = "0.12"
